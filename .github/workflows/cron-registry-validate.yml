name: Cron Registry — Validate & Report

on:
  push:
    paths:
      - 'cron-config/rules.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate rules.json structure
        run: node scripts/validate-cron-rules.mjs

      - name: Print cron status report
        run: node scripts/cron-status-report.mjs
